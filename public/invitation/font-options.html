<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>首页字体样例</title>
    <style>
      :root {
        --canvas: #d7e3ee;
        --paper: #f6f4ef;
        --ink: #292a2c;
        --muted: #68707c;
        --line: rgba(41, 42, 44, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif;
      }

      main {
        width: min(100%, 520px);
        margin: 0 auto;
        padding: 22px 16px 42px;
      }

      .intro {
        padding: 8px 2px 18px;
      }

      .intro h1 {
        margin: 0;
        font: 400 26px/1.25 "Noto Serif SC", "Songti SC", "SimSun", serif;
      }

      .intro p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }

      .option {
        margin-top: 18px;
        background: var(--paper);
        border: 1px solid var(--line);
      }

      .option__label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 11px 12px;
        border-bottom: 1px solid var(--line);
      }

      .option__label strong {
        font-size: 14px;
        line-height: 1.4;
      }

      .option__label span {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.5;
        text-align: right;
      }

      .cover {
        position: relative;
        width: 100%;
        aspect-ratio: 2 / 3;
        overflow: hidden;
        background: #cbd8e6;
      }

      .cover::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(75, 91, 111, 0.035);
        mix-blend-mode: multiply;
        pointer-events: none;
      }

      .cover img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        filter: saturate(0.9) contrast(0.97) brightness(1);
      }

      .invite {
        position: absolute;
        top: 14px;
        right: 11px;
        z-index: 1;
        margin: 0;
        writing-mode: vertical-rl;
        text-shadow: 0 1px 7px rgba(246, 244, 239, 0.95);
      }

      .title {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 72px;
        gap: 12px;
        align-items: end;
        padding: 78px 16px 18px;
        background: linear-gradient(to bottom, rgba(23, 25, 29, 0), rgba(23, 25, 29, 0.58));
      }

      .names {
        margin: 0;
        color: #f4f0e8;
        text-shadow: 0 2px 12px rgba(15, 17, 20, 0.3);
      }

      .names span {
        display: block;
      }

      .amp {
        color: #d8e0e8;
      }

      .date {
        align-self: stretch;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding-left: 12px;
        border-left: 1px solid rgba(244, 240, 232, 0.44);
        color: #e0e5ea;
        font: 500 11px/1.35 Arial, sans-serif;
        text-align: right;
        letter-spacing: 0.08em;
      }

      .date strong {
        display: block;
        margin-bottom: 4px;
        color: #f4f0e8;
        font: 500 34px/0.9 "Times New Roman", serif;
      }

      .a .invite {
        color: rgba(45, 51, 58, 0.94);
        font: 400 14px/1.55 "STXingkai", "华文行楷", "KaiTi", serif;
        letter-spacing: 0.18em;
      }

      .a .names {
        font: 400 clamp(38px, 11vw, 54px) / 1.08 "STZhongsong", "华文中宋", "Noto Serif SC", "Songti SC", serif;
        letter-spacing: 0.02em;
      }

      .a .amp {
        margin: 0.1em 0;
        font: italic 400 22px/1 "Times New Roman", serif;
      }

      .b .invite {
        color: rgba(37, 45, 54, 0.92);
        font: 400 13px/1.65 "FangSong", "STFangsong", "仿宋", serif;
        letter-spacing: 0.2em;
      }

      .b .names {
        font: 400 clamp(36px, 10.6vw, 52px) / 1.12 "STKaiti", "华文楷体", "KaiTi", serif;
        letter-spacing: 0.03em;
      }

      .b .amp {
        margin: 0.08em 0;
        font: italic 400 24px/1 "Cormorant Garamond", "Times New Roman", serif;
      }

      .c .invite {
        color: rgba(48, 54, 61, 0.9);
        font: 300 11px/1.72 "Noto Serif SC", "Songti SC", "SimSun", serif;
        letter-spacing: 0.26em;
      }

      .c .names {
        font: 350 clamp(35px, 10.4vw, 50px) / 1.14 "Noto Serif SC", "Songti SC", "SimSun", serif;
        letter-spacing: 0.08em;
      }

      .c .amp {
        margin: 0.16em 0;
        font: italic 400 20px/1 "Times New Roman", serif;
        letter-spacing: 0;
      }

      .d .invite {
        color: rgba(40, 47, 56, 0.92);
        font: 400 13px/1.55 "FZShuTi", "方正舒体", "STKaiti", "KaiTi", serif;
        letter-spacing: 0.16em;
      }

      .d .names {
        font: 400 clamp(38px, 11vw, 54px) / 1.1 "STSong", "华文宋体", "Noto Serif SC", "Songti SC", serif;
        letter-spacing: 0.01em;
      }

      .d .amp {
        margin: 0.1em 0;
        font: italic 400 23px/1 "Times New Roman", serif;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="intro">
        <h1>首页字体样例</h1>
        <p>以下只用于选择字体方向，暂时不会替换正式请柬。你可以直接告诉我选 A/B/C/D，或说“邀请语用 A，姓名用 C”。</p>
      </section>

      <section class="option a">
        <div class="option__label">
          <strong>A 法式庄园感</strong>
          <span>邀请语更柔，姓名更正式</span>
        </div>
        <div class="cover">
          <img src="./assets/wedding-hero.jpg" alt="字体样例 A" />
          <p class="invite">诚邀您见证我们的婚礼</p>
          <div class="title">
            <h2 class="names">
              <span>李辰海</span>
              <span class="amp">&amp;</span>
              <span>沙雷雨馨</span>
            </h2>
            <div class="date"><strong>06</strong><span>OCT</span><span>2026</span></div>
          </div>
        </div>
      </section>

      <section class="option b">
        <div class="option__label">
          <strong>B 手写请柬感</strong>
          <span>更温柔，浪漫感更明显</span>
        </div>
        <div class="cover">
          <img src="./assets/wedding-hero.jpg" alt="字体样例 B" />
          <p class="invite">诚邀您见证我们的婚礼</p>
          <div class="title">
            <h2 class="names">
              <span>李辰海</span>
              <span class="amp">&amp;</span>
              <span>沙雷雨馨</span>
            </h2>
            <div class="date"><strong>06</strong><span>OCT</span><span>2026</span></div>
          </div>
        </div>
      </section>

      <section class="option c">
        <div class="option__label">
          <strong>C 冷调高级感</strong>
          <span>最克制，正式且干净</span>
        </div>
        <div class="cover">
          <img src="./assets/wedding-hero.jpg" alt="字体样例 C" />
          <p class="invite">诚邀您见证我们的婚礼</p>
          <div class="title">
            <h2 class="names">
              <span>李辰海</span>
              <span class="amp">&amp;</span>
              <span>沙雷雨馨</span>
            </h2>
            <div class="date"><strong>06</strong><span>OCT</span><span>2026</span></div>
          </div>
        </div>
      </section>

      <section class="option d">
        <div class="option__label">
          <strong>D 浪漫婚书感</strong>
          <span>姓名端正，邀请语更有曲线</span>
        </div>
        <div class="cover">
          <img src="./assets/wedding-hero.jpg" alt="字体样例 D" />
          <p class="invite">诚邀您见证我们的婚礼</p>
          <div class="title">
            <h2 class="names">
              <span>李辰海</span>
              <span class="amp">&amp;</span>
              <span>沙雷雨馨</span>
            </h2>
            <div class="date"><strong>06</strong><span>OCT</span><span>2026</span></div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
